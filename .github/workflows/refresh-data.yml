name: Refresh ESC Data

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone Eurovision dataset
        run: |
          git clone --depth 1 https://github.com/EurovisionAPI/dataset.git dataset

      - name: Generate data.js
        run: |
          node extract_data.js > data.js

      - name: Validate generated data
        run: |
          lines=$(wc -l < data.js)
          echo "data.js has $lines lines"
          grep -q 'ESC_DATA' data.js || { echo "ERROR: ESC_DATA not found in data.js"; exit 1; }
          grep -q 'ESC_COUNTRIES' data.js || { echo "ERROR: ESC_COUNTRIES not found in data.js"; exit 1; }
          count=$(grep -c '{ year:' data.js)
          echo "Found $count country entries"
          [ "$count" -gt 0 ] || { echo "ERROR: No data entries generated"; exit 1; }

      - name: Assemble site directory
        run: |
          mkdir -p _site
          cp index.html esc-app.js modal-extras.js data.js _site/
          echo "Site contents:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
