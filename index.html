<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESC Recap — Eurovision performances grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* EU-inspired palette, kept minimal */
    --eu-blue: #003399;
    --eu-blue-soft: #0a48b8;
    --eu-gold: #FFCC00;
    --eu-gold-deep: #d6a800;

    --bg: #faf9f5;          /* warm cream */
    --bg-grid: #f3f1ea;     /* subtle grid line tone */
    --surface: #ffffff;
    --ink: #0e1226;         /* near-black with blue tint */
    --ink-2: #4a4f66;
    --ink-3: #8a8fa3;
    --line: #e6e3d9;
    --line-strong: #d8d4c5;

    --header-h: 64px;
    --controls-h: 56px;
    --row-h: 76px;
    --col-w: 132px;
    --col-w-rank: 156px;
    --year-w: 84px;

    --font-sans: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100%;
    overflow: hidden;
  }

  /* ---------- App shell ---------- */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    height: var(--header-h);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 24px;
    flex: 0 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--eu-blue);
    position: relative;
    display: grid;
    place-items: center;
  }
  .brand-mark::before {
    content: "";
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--eu-gold);
    background: transparent;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .brand-title {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 1px;
  }

  .topbar-stats {
    margin-left: auto;
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.1;
  }
  .stat-value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  /* ---------- Controls bar ---------- */
  .controls {
    height: var(--controls-h);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex: 0 0 auto;
  }
  .search {
    flex: 1 1 360px;
    max-width: 480px;
    position: relative;
  }
  .search input {
    width: 100%;
    height: 36px;
    padding: 0 12px 0 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    font: inherit;
    color: var(--ink);
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus {
    border-color: var(--eu-blue);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(0,51,153,0.12);
  }
  .search-icon {
    position: absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 24px; height: 24px;
    border: 0; background: transparent;
    border-radius: 4px;
    color: var(--ink-3);
    cursor: pointer;
    display: none;
  }
  .search-clear:hover { background: var(--bg-grid); color: var(--ink); }
  .search.has-value .search-clear { display: grid; place-items: center; }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(14,18,38,0.12), 0 2px 6px rgba(14,18,38,0.06);
    z-index: 60;
    max-height: 360px;
    overflow-y: auto;
    display: none;
    padding: 4px;
  }
  .search-results.open { display: block; }
  .search-results-head {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    padding: 8px 10px 4px;
  }
  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .search-result:hover, .search-result.active {
    background: var(--bg-grid);
  }
  .search-result .flag { font-size: 16px; line-height: 1; flex: 0 0 auto; }
  .search-result .body { flex: 1 1 auto; min-width: 0; }
  .search-result .title {
    font-size: 13px; font-weight: 600; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-result .sub {
    font-size: 11px; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-result .yr {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
  }
  .search-result-yt, .search-result-yt-placeholder {
    flex: 0 0 28px;
    width: 28px;
  }
  .search-result-yt {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--ink-3);
    border-radius: 4px;
    height: 28px;
    transition: color 0.12s;
  }
  .search-result-yt:hover { color: #ff0000; }
  .search-result .crown {
    color: var(--eu-gold-deep);
    font-size: 10px;
    margin-right: 4px;
  }
  .search-result mark {
    background: var(--eu-gold);
    color: var(--ink);
    padding: 0 1px;
    border-radius: 2px;
  }
  .search-result-empty {
    padding: 14px 10px;
    color: var(--ink-3);
    font-size: 12px;
    text-align: center;
  }

  .cell.flash {
    animation: flash 1.6s ease;
  }
  @keyframes flash {
    0%, 30% { box-shadow: inset 0 0 0 3px var(--eu-blue), 0 0 0 6px rgba(0,51,153,0.2); }
    100% { box-shadow: inset 0 0 0 0 transparent, 0 0 0 0 transparent; }
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 12px;
    border-left: 1px solid var(--line);
    height: 36px;
  }
  .filter-group:first-of-type { border-left: 0; padding-left: 0; }

  .filter-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-3);
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    transition: all .15s;
    user-select: none;
  }
  .toggle:hover { border-color: var(--line-strong); color: var(--ink); }
  .toggle[aria-pressed="true"] {
    background: var(--eu-gold);
    border-color: var(--eu-gold-deep);
    color: var(--ink);
    font-weight: 600;
  }
  .toggle .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ink-3);
  }
  .toggle[aria-pressed="true"] .dot {
    background: var(--ink);
    box-shadow: 0 0 0 2px rgba(14,18,38,0.1);
  }

  .sort-group {
    display: inline-flex;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface);
  }
  .sort-btn {
    border: 0;
    background: transparent;
    padding: 0 14px;
    font: inherit;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .15s;
  }
  .sort-btn + .sort-btn { border-left: 1px solid var(--line); }
  .sort-btn:hover { color: var(--ink); background: var(--bg-grid); }
  .sort-btn[aria-pressed="true"] {
    background: var(--eu-blue);
    color: white;
    font-weight: 600;
  }

  .range-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }
  .range-readout {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink);
    min-width: 96px;
    font-variant-numeric: tabular-nums;
  }
  .dual-range {
    position: relative;
    width: 200px;
    height: 24px;
  }
  .dual-range .track {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    transform: translateY(-50%);
  }
  .dual-range .fill {
    position: absolute;
    top: 50%;
    height: 3px;
    background: var(--eu-blue);
    border-radius: 2px;
    transform: translateY(-50%);
  }
  .dual-range input[type="range"] {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: none;
    pointer-events: none;
    -webkit-appearance: none;
    appearance: none;
    margin: 0;
  }
  .dual-range input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    pointer-events: auto;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--eu-blue);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .dual-range input[type="range"]::-moz-range-thumb {
    pointer-events: auto;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--eu-blue);
    cursor: pointer;
  }

  .country-picker {
    position: relative;
  }
  .country-picker-btn {
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    color: var(--ink-2);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .country-picker-btn:hover { border-color: var(--line-strong); color: var(--ink); }
  .country-picker-btn.active {
    border-color: var(--eu-blue);
    color: var(--eu-blue);
  }
  .country-picker-btn .badge {
    background: var(--eu-blue);
    color: white;
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .country-panel {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 320px;
    max-height: 360px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(14,18,38,0.12), 0 2px 6px rgba(14,18,38,0.06);
    z-index: 50;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .country-panel.open { display: flex; }
  .country-panel-header {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .country-panel input {
    flex: 1;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 8px;
    font: inherit;
    font-size: 12px;
    outline: none;
  }
  .country-panel input:focus { border-color: var(--eu-blue); }
  .country-panel-actions {
    display: flex;
    gap: 4px;
  }
  .link-btn {
    border: 0;
    background: transparent;
    color: var(--eu-blue);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .link-btn:hover { background: var(--bg-grid); }

  .country-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
  }
  .country-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .country-row:hover { background: var(--bg-grid); }
  .country-row input {
    appearance: none;
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border: 1.5px solid var(--line-strong);
    border-radius: 4px;
    background: var(--surface);
    margin: 0;
    cursor: pointer;
    flex: 0 0 16px;
    display: grid;
    place-items: center;
    transition: all .12s ease;
  }
  .country-row input:hover { border-color: var(--eu-blue); }
  .country-row input:checked {
    background: var(--eu-blue);
    border-color: var(--eu-blue);
  }
  .country-row input:checked::after {
    content: "";
    width: 9px; height: 5px;
    border-left: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .country-row input:focus-visible {
    outline: 2px solid var(--eu-blue);
    outline-offset: 2px;
  }
  .country-row .flag { font-size: 16px; line-height: 1; flex: 0 0 auto; }
  .country-row .name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    color: var(--ink);
  }
  .country-row .code {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    margin-left: auto;
    flex: 0 0 auto;
    letter-spacing: 0.04em;
  }

  /* ---------- Grid ---------- */
  .grid-wrap {
    flex: 1 1 auto;
    overflow: auto;
    background: var(--bg);
    position: relative;
    scrollbar-color: var(--line-strong) transparent;
  }
  .grid {
    position: relative;
    display: grid;
    /* set in JS */
  }

  /* corner cell */
  .corner {
    position: sticky;
    top: 0; left: 0;
    z-index: 30;
    background: var(--surface);
    border-right: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
    display: flex;
    align-items: flex-end;
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .corner .axis-label {
    line-height: 1.3;
  }

  /* country header (top, sticky) */
  .col-head {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line-strong);
    padding: 10px 8px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
  }
  .col-head .flag {
    font-size: 22px;
    line-height: 1;
  }
  .col-head .rank {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--eu-blue);
    line-height: 1;
  }
  .col-head.rank-head {
    justify-content: center;
    align-items: center;
  }
  .col-head .rank-label {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--eu-blue);
    letter-spacing: 0.02em;
  }
  .col-head .rank-label sup {
    font-size: 10px;
    font-weight: 500;
  }
  .col-head .rank-label .crown {
    color: var(--eu-gold-deep);
    margin-right: 3px;
  }
  .col-head .wins {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--eu-gold-deep);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .col-head .code {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
  }
  .col-head .name {
    font-size: 11px;
    color: var(--ink-2);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
  }
  .col-head[data-active="true"] .code { color: var(--eu-blue); font-weight: 600; }

  /* year header (left, sticky) */
  .row-head {
    position: sticky;
    left: 0;
    z-index: 15;
    background: var(--surface);
    border-right: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .row-head[data-decade="true"] {
    color: var(--ink);
    font-weight: 600;
  }
  .row-head .winner-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--eu-gold);
    margin-right: 8px;
    opacity: 0;
  }
  .row-head[data-has-winner="true"] .winner-dot { opacity: 1; }

  /* cells */
  .cell {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
    background: var(--surface);
    position: relative;
    transition: background .12s;
    overflow: hidden;
  }
  .cell:hover {
    background: #fffdf3;
    z-index: 5;
  }
  .cell.empty {
    cursor: default;
    background: var(--bg-grid);
    background-image: repeating-linear-gradient(
      135deg,
      var(--bg-grid) 0,
      var(--bg-grid) 6px,
      #ece8dd 6px,
      #ece8dd 7px
    );
  }
  .cell.empty:hover { background-color: var(--bg-grid); }
  .cell.dimmed {
    opacity: 0.22;
    filter: saturate(0.5);
  }
  .cell.match {
    box-shadow: inset 0 0 0 2px var(--eu-blue);
    z-index: 6;
  }
  .cell.winner {
    background: linear-gradient(180deg, #fff8d8 0%, #fff3bd 100%);
  }
  .cell.winner:hover { background: linear-gradient(180deg, #fff3bd 0%, #ffeca0 100%); }

  .cell-place {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    font-weight: 500;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cell-flag {
    margin-left: auto;
    font-size: 14px;
    line-height: 1;
  }
  .cell.winner .cell-place {
    color: var(--ink);
    font-weight: 700;
  }
  .cell-place .crown {
    color: var(--eu-gold-deep);
    font-size: 10px;
  }
  .cell-sf {
    font-size: 9px;
    letter-spacing: 0.04em;
    opacity: 0.55;
  }
  .cell-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    text-overflow: ellipsis;
  }
  .cell-artist {
    font-size: 11px;
    color: var(--ink-2);
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }


  /* empty / no-results state inside grid */
  .empty-state {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(250,249,245,0.92);
    backdrop-filter: blur(2px);
    z-index: 25;
    pointer-events: none;
  }
  .empty-state-card {
    text-align: center;
    pointer-events: auto;
  }
  .empty-state-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .empty-state-sub {
    color: var(--ink-2);
    font-size: 13px;
    margin-bottom: 14px;
  }
  .empty-state button {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .empty-state button:hover { border-color: var(--eu-blue); color: var(--eu-blue); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(14,18,38,0.72);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fade-in .15s ease;
  }
  .modal-backdrop.open { display: flex; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(960px, 100%);
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    animation: pop-in .18s ease;
    display: flex;
    flex-direction: column;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  .modal-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .modal-flag {
    font-size: 36px;
    line-height: 1;
    margin-top: 2px;
  }
  .modal-titles {
    flex: 1;
    min-width: 0;
  }
  .modal-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .modal-meta .pill {
    background: var(--bg-grid);
    color: var(--ink-2);
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.06em;
  }
  .modal-meta .pill.winner {
    background: var(--eu-gold);
    color: var(--ink);
    font-weight: 600;
  }
  .modal-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .modal-artist {
    font-size: 14px;
    color: var(--ink-2);
  }
  .modal-close {
    border: 0;
    background: var(--bg-grid);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink-2);
    display: grid;
    place-items: center;
  }
  .modal-close:hover { background: var(--ink); color: var(--surface); }

  .modal-video {
    aspect-ratio: 16 / 9;
    background: #000;
    position: relative;
  }
  .modal-video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .modal-novideo {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(255,255,255,0.7);
    font-family: var(--font-mono);
    font-size: 12px;
    text-align: center;
    padding: 20px;
  }
  .modal-yt-fallback {
    position: absolute;
    inset: 0;
    display: block;
    text-decoration: none;
  }
  .modal-yt-fallback img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .modal-yt-fallback-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.05em;
    transition: background 0.15s;
  }
  .modal-yt-fallback:hover .modal-yt-fallback-overlay {
    background: rgba(0,0,0,0.25);
  }

  /* legend strip */
  .legend {
    padding: 8px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    display: flex;
    gap: 18px;
    align-items: center;
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 12px; height: 12px;
    border-radius: 2px;
    border: 1px solid var(--line-strong);
  }
  .legend-swatch.winner { background: linear-gradient(180deg, #fff8d8, #fff3bd); }
  .legend-swatch.match { background: var(--surface); box-shadow: inset 0 0 0 2px var(--eu-blue); }
  .legend-swatch.empty { background: repeating-linear-gradient(135deg, var(--bg-grid) 0, var(--bg-grid) 4px, #ece8dd 4px, #ece8dd 5px); }
  .legend-spacer { flex: 1; }
  .legend-attribution {
    padding-left: 18px;
    border-left: 1px solid var(--line);
    color: var(--ink-3);
  }
  .legend-attribution a {
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px dotted var(--ink-3);
  }
  .legend-attribution a:hover { color: var(--eu-blue); border-bottom-color: var(--eu-blue); }
  .legend-hint kbd {
    font-family: var(--font-mono);
    background: var(--bg-grid);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    color: var(--ink-2);
  }

  /* ---------- Mobile (≤640px) ---------- */
  @media (max-width: 640px) {
    :root {
      --header-h: 52px;
      --controls-h: auto;
      --row-h: 60px;
      --col-w: 84px;
      --col-w-rank: 92px;
      --year-w: 48px;
    }

    .topbar { padding: 0 12px; gap: 12px; }
    .topbar-stats { display: none; }
    .brand-sub { display: none; }
    .brand-title { font-size: 14px; }

    .controls {
      height: auto;
      flex-wrap: wrap;
      padding: 8px 10px;
      gap: 8px;
    }
    .filter-group {
      border-left: 0;
      padding-left: 0;
      height: auto;
      flex-wrap: wrap;
    }
    .filter-label { display: none; }
    .search { flex: 1 1 100%; max-width: none; }
    .dual-range { width: 140px; }
    .range-readout { min-width: 80px; font-size: 11px; }

    .country-panel { width: calc(100vw - 20px); left: 0; }

    .cell { padding: 4px 5px; gap: 1px; }
    .cell-title { font-size: 10px; line-height: 1.2; }
    .cell-artist { font-size: 9px; }
    .cell-place { font-size: 9px; }
    .cell-flag { font-size: 11px; }

    .col-head { padding: 6px 2px 4px; gap: 2px; }
    .col-head .flag { font-size: 16px; }
    .col-head .name { display: none; }
    .col-head .code { font-size: 9px; }
    .col-head .rank-label { font-size: 12px; }

    .row-head { padding: 0 6px; font-size: 11px; }

    .modal-backdrop { padding: 0; }
    .modal { border-radius: 0; height: 100%; width: 100%; }
    .modal-header { padding: 12px 14px 10px; gap: 10px; }
    .modal-flag { font-size: 28px; }
    .modal-title { font-size: 18px; }

    .legend { padding: 6px 10px; gap: 10px; flex-wrap: wrap; font-size: 10px; }
    .legend-hint { display: none; }
    .legend-attribution { padding-left: 0; border-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">ESC Recap</div>
        <div class="brand-sub">Eurovision performances · 1956 → 2024</div>
      </div>
    </div>
    <div class="topbar-stats">
      <div class="stat">
        <div class="stat-value" id="stat-entries">—</div>
        <div class="stat-label">Entries shown</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-countries">—</div>
        <div class="stat-label">Countries</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-years">—</div>
        <div class="stat-label">Years</div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="search" id="search-wrap">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </span>
      <input id="search" type="text" placeholder="Search song, artist, country, year…" autocomplete="off" />
      <button class="search-clear" id="search-clear" aria-label="Clear search">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="search-results" id="search-results" role="listbox"></div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Years</span>
      <div class="range-wrap">
        <div class="dual-range" id="year-range">
          <div class="track"></div>
          <div class="fill" id="year-fill"></div>
          <input type="range" id="year-min" />
          <input type="range" id="year-max" />
        </div>
        <div class="range-readout" id="year-readout">1956–2024</div>
      </div>
    </div>

    <div class="filter-group">
      <div class="country-picker" id="country-picker">
        <button class="country-picker-btn" id="country-btn" aria-haspopup="listbox" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          <span id="country-btn-label">All countries</span>
          <span class="badge" id="country-btn-badge" style="display:none">0</span>
        </button>
        <div class="country-panel" id="country-panel" role="listbox">
          <div class="country-panel-header">
            <input type="text" id="country-filter" placeholder="Filter countries…" />
            <div class="country-panel-actions">
              <button class="link-btn" id="country-all">All</button>
              <button class="link-btn" id="country-none">None</button>
            </div>
          </div>
          <div class="country-list" id="country-list"></div>
        </div>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Sort</span>
      <div class="sort-group" role="group">
        <button class="sort-btn" id="sort-place" aria-pressed="true">Placement</button>
        <button class="sort-btn" id="sort-alpha" aria-pressed="false">A–Z</button>
      </div>
    </div>

    <div class="filter-group">
      <button class="toggle" id="winners-toggle" aria-pressed="false">
        <span class="dot"></span>
        Winners only
      </button>
    </div>
  </div>

  <main class="grid-wrap" id="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-state-card">
        <div class="empty-state-title">No matches</div>
        <div class="empty-state-sub">Try widening the year range or clearing filters.</div>
        <button id="reset-filters">Reset filters</button>
      </div>
    </div>
  </main>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch winner"></span> Winner</div>
    <div class="legend-item"><span class="legend-swatch match"></span> Search match</div>
    <div class="legend-item"><span class="legend-swatch empty"></span> No entry</div>
    <div class="legend-spacer"></div>
    <div class="legend-hint">Click any cell to play · <kbd>Esc</kbd> to close · <kbd>/</kbd> to search</div>
    <div class="legend-attribution">Data: <a href="https://github.com/EurovisionAPI/dataset" target="_blank" rel="noopener">EurovisionAPI/dataset</a></div>
  </div>
</div>

<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true">
  <div class="modal" role="document">
    <div class="modal-header">
      <div class="modal-flag" id="modal-flag">🏳️</div>
      <div class="modal-titles">
        <div class="modal-meta">
          <span class="pill" id="modal-year">—</span>
          <span class="pill" id="modal-country">—</span>
          <span class="pill" id="modal-place">—</span>
        </div>
        <div class="modal-title" id="modal-title">—</div>
        <div class="modal-artist" id="modal-artist">—</div>
      </div>
      <button class="modal-close" id="modal-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-video" id="modal-video"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="esc-app.js"></script>
</body>
</html>
